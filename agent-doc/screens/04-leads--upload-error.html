<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads — Upload Error — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased relative">

  <!-- Background content dimmed -->
  <div class="pl-16 md:pl-60 opacity-40 select-none pointer-events-none" aria-hidden="true">
    <header class="border-b border-[var(--color-border)] bg-[var(--color-card)] py-3 px-6 flex justify-between items-center">
      <span class="text-lg font-bold tracking-tight">Leads</span>
      <button class="rounded-xl bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-white">Upload Leads</button>
    </header>
    <main class="max-w-6xl mx-auto p-6 space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div class="h-28 rounded-2xl bg-white border border-[var(--color-border)]"></div>
        <div class="h-28 rounded-2xl bg-white border border-[var(--color-border)]"></div>
      </div>
      <div class="h-56 rounded-2xl bg-white border border-[var(--color-border)]"></div>
    </main>
  </div>

  <!-- UPLOAD LEADS MODAL WITH ERROR STATE (Screen 9) -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-xs">
    <div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="w-full max-w-md rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl">
      
      <div class="flex items-center justify-between border-b border-[var(--color-border)] pb-3">
        <div class="flex items-center gap-2.5">
          <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-red-50 text-[var(--color-destructive)]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </span>
          <div>
            <h2 id="modal-title" class="text-base font-bold tracking-tight">Upload Leads</h2>
            <p class="text-xs text-[var(--color-muted-foreground)]">Single-column CSV file (max 2 MB)</p>
          </div>
        </div>
        <button type="button" aria-label="Close" class="rounded-lg p-1.5 text-[var(--color-muted-foreground)] hover:bg-[var(--color-muted)] hover:text-[var(--color-foreground)]">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form class="mt-4 space-y-4">
        <!-- CSV File with Red Error State -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-destructive)]">CSV File</label>
          <div class="mt-1.5 flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-[var(--color-destructive)] bg-red-50/40 p-5 text-center">
            <svg class="h-8 w-8 text-[var(--color-destructive)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <p class="mt-2 text-xs font-bold text-red-900">raw_export_october_full.csv (3.4 MB)</p>
            <p class="mt-1 text-xs font-medium text-[var(--color-destructive)]">File size exceeds 2 MB limit (maximum file size is 2 MB).</p>
            <button type="button" class="mt-3 rounded-lg border border-red-300 bg-white px-3 py-1.5 text-xs font-semibold text-[var(--color-destructive)] shadow-xs hover:bg-red-50">Choose Different File</button>
          </div>
        </div>

        <div>
          <label for="modal-country" class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)]">Default Country</label>
          <select id="modal-country" class="mt-1.5 w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-2 text-sm font-medium focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
            <option value="IN" selected>India (IN +91)</option>
            <option value="AE">UAE (AE +971)</option>
            <option value="US">United States (US +1)</option>
          </select>
        </div>

        <div class="flex items-center justify-end gap-2 border-t border-[var(--color-border)] pt-4">
          <button type="button" class="rounded-xl border border-[var(--color-border)] px-4 py-2 text-xs font-semibold text-[var(--color-muted-foreground)] hover:bg-[var(--color-muted)]">Cancel</button>
          <button type="button" disabled class="flex cursor-not-allowed items-center gap-1.5 rounded-xl bg-slate-300 px-4 py-2 text-xs font-semibold text-slate-500 opacity-60">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Leads
          </button>
        </div>
      </form>

    </div>
  </div>

</body>
</html>
