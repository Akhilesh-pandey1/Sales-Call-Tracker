<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialer — Schedule Lead Follow-up — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col relative">

    <!-- Top Sub-Tab Switch -->
    <header class="border-b border-[var(--color-border)] bg-[var(--color-card)] px-4 py-2.5 shadow-sm opacity-60">
      <div class="flex rounded-xl bg-[var(--color-muted)] p-1 text-sm font-semibold">
        <button type="button" class="flex-1 rounded-lg py-2 text-center text-[var(--color-muted-foreground)]">Keypad</button>
        <button type="button" class="flex-1 rounded-lg py-2 text-center bg-[var(--color-card)] text-[var(--color-primary)] shadow-sm">Automated</button>
      </div>
    </header>

    <main class="flex flex-1 flex-col px-5 pb-4 pt-3 opacity-60">
      <div class="my-auto py-2">
        <div class="rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-md text-center">
          <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-bold text-[var(--color-primary)]">Attempt 1 of 3</span>
          <p class="mt-4 text-3xl font-extrabold tracking-tight tabular-nums">+91 98765 43210</p>
        </div>
      </div>
    </main>

    <!-- Modal Backdrop and Dialog -->
    <div class="absolute inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
      <div class="w-full max-w-sm rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-50 text-[var(--color-primary)]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <h3 class="text-base font-bold tracking-tight">Schedule Follow-up</h3>
          </div>
        </div>

        <p class="mt-2 text-xs text-[var(--color-muted-foreground)]">Reserve this lead (+91 98765 43210) for yourself. Follow-up time must be in the future within 30 days.</p>

        <form class="mt-5 space-y-4">
          <div>
            <label for="sched-date" class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)]">Date</label>
            <input type="date" id="sched-date" value="2026-10-15" min="2026-10-14" max="2026-11-14" class="mt-1.5 w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-3.5 py-2.5 text-sm font-medium focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
          </div>

          <div>
            <label for="sched-time" class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)]">Time (IST)</label>
            <input type="time" id="sched-time" value="11:30" class="mt-1.5 w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-3.5 py-2.5 text-sm font-medium focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
          </div>

          <div class="mt-6 grid grid-cols-2 gap-3 pt-2">
            <button type="button" class="cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-muted)] py-3 text-xs font-bold text-[var(--color-foreground)] transition-colors hover:bg-[var(--color-border)]">Cancel</button>
            <button type="button" class="cursor-pointer rounded-xl bg-[var(--color-primary)] py-3 text-xs font-bold text-[var(--color-on-primary)] shadow-sm transition-colors hover:bg-[var(--color-secondary)]">Save Reservation</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bottom tab bar -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)] opacity-60" aria-label="App tabs">
      <div class="grid grid-cols-2">
        <div class="flex flex-col items-center gap-1 py-2.5 text-xs font-semibold text-[var(--color-primary)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Dialer
        </div>
        <div class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
          My Stats
        </div>
      </div>
    </nav>

  </div>

</body>
</html>
