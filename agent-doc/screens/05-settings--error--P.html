<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — end before start — Apex Sales Call (v2 light)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #000000;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #000000;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <h1 class="sr-only">Settings</h1>

  <!-- Sidebar: icon rail on mobile, open with labels on PC -->
  <aside class="fixed inset-y-0 left-0 z-10 flex w-16 flex-col border-r border-[var(--color-border)] bg-[var(--color-card)] px-2 py-4 md:w-60 md:px-3" aria-label="Main navigation">
    <div class="flex items-center gap-3 px-1.5 md:px-2">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[var(--color-primary)] text-[var(--color-on-primary)]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      <span class="hidden text-base font-bold tracking-tight md:block">Apex Sales Call</span>
    </div>

    <p class="mt-7 mb-2 hidden px-2 text-[11px] font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)] md:block">Menu</p>

    <nav class="flex flex-col gap-1">
      <a href="#" title="Dashboard" class="flex cursor-pointer items-center justify-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] hover:text-[var(--color-foreground)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span class="hidden md:inline">Dashboard</span>
      </a>
      <a href="#" title="Team" class="flex cursor-pointer items-center justify-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] hover:text-[var(--color-foreground)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="hidden md:inline">Team</span>
      </a>
      <a href="#" title="Leads" class="flex cursor-pointer items-center justify-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] hover:text-[var(--color-foreground)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span class="hidden md:inline">Leads</span>
      </a>
      <a href="#" title="Accounts" class="flex cursor-pointer items-center justify-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] hover:text-[var(--color-foreground)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="hidden md:inline">Accounts</span>
      </a>
      <a href="#" title="Settings" aria-current="page" class="flex cursor-pointer items-center justify-center gap-3 rounded-xl bg-[var(--color-primary)] px-3 py-2.5 text-sm font-semibold text-[var(--color-on-primary)] transition-colors duration-200 hover:bg-[var(--color-secondary)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
        <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="hidden md:inline">Settings</span>
      </a>
    </nav>

    <a href="#" title="Log out" class="mt-auto flex cursor-pointer items-center justify-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] hover:text-[var(--color-destructive)] md:justify-start focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-card)]">
      <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="hidden md:inline">Log out</span>
    </a>
  </aside>

  <div class="pl-16 md:pl-60">

    <!-- Top bar -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-border)] bg-[var(--color-card)]">
      <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 py-3 sm:px-6">
        <span class="text-lg font-bold tracking-tight">Settings</span>
        <span class="text-sm text-[var(--color-muted-foreground)]">Thursday, September 18</span>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl px-4 pb-12 pt-6 sm:px-6">

      <!-- Office hours: refused save - the API's exact message shows in red, nothing is stored -->
      <section aria-label="Office hours" class="max-w-2xl overflow-hidden rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm">
        <div class="flex items-center justify-between gap-3 px-5 pt-5 sm:px-6">
          <h2 class="text-base font-bold tracking-tight">Office hours</h2>
          <span class="text-xs text-[var(--color-muted-foreground)]">Applies every day · Sunday included</span>
        </div>
        <div class="px-5 pb-5 sm:px-6">
          <p class="mt-1 text-sm text-[var(--color-muted-foreground)]">
            Current window:
            <span class="font-semibold tabular-nums text-[var(--color-foreground)]">10:00 – 19:00 IST</span>
            · calls that start outside this window are not counted.
          </p>

          <div class="mt-4 flex flex-wrap items-end gap-3">
            <div>
              <label for="start-time" class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)]">Start time</label>
              <input id="start-time" type="time" value="10:00" class="mt-1.5 cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-2 text-sm font-medium tabular-nums focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
            </div>
            <div>
              <label for="end-time" class="block text-xs font-semibold uppercase tracking-wider text-[var(--color-destructive)]">End time</label>
              <input id="end-time" type="time" value="09:30" aria-invalid="true" class="mt-1.5 cursor-pointer rounded-xl border border-[var(--color-destructive)] bg-red-50/40 px-3 py-2 text-sm font-medium tabular-nums focus:outline-none focus:ring-2 focus:ring-[var(--color-destructive)]">
            </div>
            <button type="button" id="save-office-hours" class="cursor-pointer rounded-xl bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-[var(--color-on-primary)] transition-colors duration-200 hover:bg-[var(--color-secondary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Save</button>
          </div>

          <p id="office-hours-message" class="mt-3 rounded-xl bg-red-50 px-3 py-2 text-sm font-medium text-[var(--color-destructive)]">End time must be after start time.</p>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
