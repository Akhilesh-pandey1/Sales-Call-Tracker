<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialer — Empty State — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: Compact & Sleek Sub-Tab Switch -->
    <header class="sticky top-0 z-20 flex items-center justify-center border-b border-[var(--color-border)] bg-[var(--color-card)] py-2 px-4 shadow-xs">
      <div class="inline-flex items-center rounded-full bg-[var(--color-muted)] p-0.5 border border-[var(--color-border)] text-xs font-semibold">
        <button type="button" class="rounded-full px-4 py-1 text-xs bg-[var(--color-primary)] text-white shadow-xs">
          Keypad
        </button>
        <button type="button" class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">
          Automated
        </button>
      </div>
    </header>

    <main class="flex flex-1 flex-col px-5 pb-4 pt-3">
      <div class="my-auto py-2">

        <!-- Number display: empty state -->
        <div class="flex items-center justify-center gap-3 py-2" aria-live="polite">
          <p class="flex-1 text-right text-3xl font-medium tracking-[0.08em] text-[var(--color-muted-foreground)]">Enter number</p>
          <button type="button" title="Backspace" aria-label="Backspace" class="flex h-11 w-11 shrink-0 cursor-not-allowed items-center justify-center rounded-full text-slate-300">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
        </div>

        <!-- Paste button -->
        <button type="button" class="mx-auto mt-1 flex cursor-pointer items-center gap-2 rounded-full border border-[var(--color-border)] bg-[var(--color-card)] px-5 py-1.5 text-xs font-semibold text-[var(--color-primary)] hover:bg-[var(--color-muted)]">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          Paste
        </button>

        <!-- Keypad grid -->
        <div class="mx-auto mt-4 grid w-full max-w-[14rem] grid-cols-3 gap-x-4 gap-y-2.5" aria-label="Keypad">
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">1</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">2</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">3</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">4</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">5</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">6</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">7</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">8</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">9</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">*</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">0</span></button>
          <button type="button" class="flex h-15 w-15 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-card)] shadow-sm hover:bg-[var(--color-muted)]"><span class="text-2xl font-semibold">#</span></button>
        </div>

        <!-- Call button: grey and disabled until number is valid -->
        <div class="mt-4">
          <button type="button" disabled class="flex w-full cursor-not-allowed items-center justify-center gap-2.5 rounded-2xl bg-slate-200 py-3 text-lg font-bold text-slate-400 shadow-none">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            Call
          </button>
          <p class="mt-2 text-center text-[11px] text-[var(--color-muted-foreground)]">Type a valid 10-digit number to enable calling.</p>
        </div>

      </div>
    </main>

    <!-- Bottom tab bar: 3 tabs - Dialer | My Stats | Settings -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)]" aria-label="App tabs">
      <div class="grid grid-cols-3">
        <a href="#" aria-current="page" class="flex flex-col items-center gap-1 py-2.5 text-xs font-semibold text-[var(--color-primary)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Dialer
        </a>
        <a href="#" class="flex cursor-pointer flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
          My Stats
        </a>
        <a href="#" class="flex cursor-pointer flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Settings
        </a>
      </div>
    </nav>

  </div>

</body>
</html>
