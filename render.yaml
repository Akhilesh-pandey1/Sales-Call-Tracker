services:
  - type: web
    name: sales-call-tracker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: ..
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
