<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Stats — Server Unreachable — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: my name -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-border)] bg-[var(--color-card)]">
      <div class="flex items-center px-5 py-3">
        <div class="flex items-center gap-3">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[var(--color-primary)] text-sm font-bold text-[var(--color-on-primary)]">PS</span>
          <div>
            <h1 class="text-lg font-bold tracking-tight leading-tight">Priya Sharma</h1>
            <p class="text-xs text-[var(--color-muted-foreground)]">My Calling Stats</p>
          </div>
        </div>
      </div>
    </header>

    <main class="flex flex-1 flex-col px-5 pb-6 pt-4">
      <div class="my-auto">

        <!-- Server unreachable: no numbers at all - never fake zeros; the next tab open retries -->
        <div class="flex flex-col items-center rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] px-6 py-10 text-center shadow-sm" role="alert">
          <span class="flex h-14 w-14 items-center justify-center rounded-full bg-[var(--color-muted)] text-[var(--color-muted-foreground)]">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m2 2 20 20"/>
              <path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/>
              <path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>
              <path d="M9.365 9.365a4.5 4.5 0 0 0 5.135 5.135"/>
            </svg>
          </span>
          <p class="mt-4 text-base font-bold leading-snug">Can't reach the server. Check your internet.</p>
          <p class="mt-1.5 text-sm text-[var(--color-muted-foreground)]">Your numbers did not load. Check your internet and try again.</p>
          <button type="button" onclick="location.reload()" class="mt-6 w-full cursor-pointer rounded-xl bg-[var(--color-primary)] py-3 text-sm font-bold text-[var(--color-on-primary)] transition-colors duration-200 hover:bg-[var(--color-secondary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Retry</button>
        </div>

      </div>
    </main>

    <!-- Bottom tab bar: 5 tabs - Dialer | Scheduled | History | My Stats | Settings -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)]" aria-label="App tabs">
      <div class="grid grid-cols-5">
        <a href="#" class="relative flex cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:text-[var(--color-foreground)]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Dialer</a>
        <a href="#" class="relative flex cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:text-[var(--color-foreground)]"><span class="relative"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="absolute -right-2 -top-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-[var(--color-destructive)] px-1 text-[9px] font-bold text-white">2</span></span>Scheduled</a>
        <a href="#" class="relative flex cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:text-[var(--color-foreground)]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</a>
        <a href="#" aria-current="page" class="flex flex-col items-center gap-1 py-2 text-xs font-semibold text-[var(--color-primary)]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>My Stats</a>
        <a href="#" class="relative flex cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)] transition-colors duration-200 hover:text-[var(--color-foreground)]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      </div>
    </nav>

  </div>

</body>
</html>
