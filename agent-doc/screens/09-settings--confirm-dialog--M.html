<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Clear Data Dialog — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: Settings is a top-level tab, so no Back button -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-border)] bg-[var(--color-card)] opacity-50">
      <div class="flex items-center px-5 py-3">
        <h1 class="text-lg font-bold tracking-tight">Settings</h1>
      </div>
    </header>

    <main class="flex flex-1 flex-col px-5 pb-6 pt-4 opacity-50">
      <div class="my-auto">
        <p class="px-1 text-xs font-semibold uppercase tracking-wider text-[var(--color-muted-foreground)]">Local data</p>
        <div class="mt-2 flex w-full items-center gap-4 rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] p-4 text-left shadow-sm">
          <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-red-50 text-[var(--color-destructive)]">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </span>
          <span class="flex-1">
            <span class="block text-base font-bold">Clear local data</span>
            <span class="mt-0.5 block text-xs text-[var(--color-muted-foreground)]">Deletes only the calls on this phone that haven't reached the server yet.</span>
          </span>
        </div>
      </div>
    </main>

    <!-- Bottom tab bar: 3 tabs - Dialer | My Stats | Settings -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)] opacity-50" aria-label="App tabs">
      <div class="grid grid-cols-3">
        <div class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Dialer
        </div>
        <div class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
          My Stats
        </div>
        <div class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Settings
        </div>
      </div>
    </nav>

  </div>

  <!-- Confirmation dialog: N is the real count of unsent calls on the phone -->
  <div class="fixed inset-0 z-30 flex items-center justify-center bg-black/50 p-6">
    <div class="w-full max-w-sm rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl" role="alertdialog" aria-modal="true" aria-label="Clear local data">
      <span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-red-50 text-[var(--color-destructive)]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      </span>
      <p class="mt-4 text-base font-bold leading-snug">This deletes 4 calls not yet sent to the server. Cannot be undone.</p>
      <p class="mt-1.5 text-xs text-[var(--color-muted-foreground)]">The numbers already on the server stay exactly as they are.</p>
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button type="button" class="cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] py-3 text-xs font-bold text-[var(--color-foreground)] transition-colors hover:bg-[var(--color-muted)]">Cancel</button>
        <button type="button" class="cursor-pointer rounded-xl bg-[var(--color-destructive)] py-3 text-xs font-bold text-[var(--color-on-destructive)] shadow-sm hover:opacity-90">Delete</button>
      </div>
    </div>
  </div>

</body>
</html>
