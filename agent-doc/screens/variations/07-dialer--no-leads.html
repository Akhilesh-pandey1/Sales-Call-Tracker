<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialer — No Leads Available — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Top Sub-Tab Switch -->
    <header class="sticky top-0 z-20 border-b border-[var(--color-border)] bg-[var(--color-card)] px-4 py-2.5 shadow-sm">
      <div class="flex rounded-xl bg-[var(--color-muted)] p-1 text-sm font-semibold">
        <button type="button" class="flex-1 rounded-lg py-2 text-center text-[var(--color-muted-foreground)]">Keypad</button>
        <button type="button" class="flex-1 rounded-lg py-2 text-center bg-[var(--color-card)] text-[var(--color-primary)] shadow-sm">Automated</button>
      </div>
    </header>

    <main class="flex flex-1 flex-col px-5 pb-4 pt-3">
      <div class="my-auto py-8 text-center">

        <!-- No leads empty icon -->
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-50 text-[var(--color-primary)] shadow-sm">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 14 14"/>
          </svg>
        </span>

        <h2 class="mt-4 text-xl font-bold tracking-tight">All Caught Up</h2>
        <p class="mt-2 text-sm text-[var(--color-muted-foreground)] px-4">No leads available right now. Check back later.</p>

        <button type="button" onclick="location.reload()" class="mt-6 inline-flex cursor-pointer items-center gap-2 rounded-xl bg-[var(--color-primary)] px-6 py-3 text-sm font-bold text-[var(--color-on-primary)] shadow-sm transition-colors hover:bg-[var(--color-secondary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
          Refresh Pool
        </button>

      </div>
    </main>

    <!-- Bottom tab bar: 2 tabs - Dialer | My Stats -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)]" aria-label="App tabs">
      <div class="grid grid-cols-2">
        <a href="#" aria-current="page" class="flex flex-col items-center gap-1 py-2.5 text-xs font-semibold text-[var(--color-primary)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Dialer
        </a>
        <a href="#" class="flex cursor-pointer flex-col items-center gap-1 py-2.5 text-xs font-medium text-[var(--color-muted-foreground)] hover:text-[var(--color-foreground)]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
          My Stats
        </a>
      </div>
    </nav>

  </div>

</body>
</html>
