<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My List — clear dialog — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="relative mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: My List active, dimmed behind the dialog -->
    <header class="sticky top-0 z-20 flex items-center justify-center border-b border-[var(--color-border)] bg-[var(--color-card)] py-2 px-4 shadow-xs opacity-50">
      <div class="inline-flex items-center rounded-full bg-[var(--color-muted)] p-0.5 border border-[var(--color-border)] text-xs font-semibold">
        <span class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">Keypad</span>
        <span class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">Automated</span>
        <span class="rounded-full px-4 py-1 text-xs bg-[var(--color-primary)] text-white shadow-xs">My List</span>
      </div>
    </header>

    <!-- Background: the list, dimmed behind the dialog -->
    <main class="flex-1 px-5 pb-6 pt-4 opacity-50">

      <!-- Count chips -->
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-1.5 text-xs font-semibold"><span class="h-2 w-2 rounded-full bg-slate-400"></span>Left <span class="tabular-nums">8</span></span>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-1.5 text-xs font-semibold"><span class="h-2 w-2 rounded-full bg-[var(--color-primary)]"></span>Called <span class="tabular-nums">12</span></span>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-1.5 text-xs font-semibold"><span class="h-2 w-2 rounded-full bg-[var(--color-accent)]"></span>Interested <span class="tabular-nums">3</span></span>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-1.5 text-xs font-semibold"><span class="h-2 w-2 rounded-full bg-[var(--color-destructive)]"></span>Do not call <span class="tabular-nums">1</span></span>
      </div>

      <!-- Rows (dimmed) -->
      <section aria-label="My List numbers" class="mt-4 flex flex-col gap-2">
        <div class="flex items-center justify-between rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-3">
          <span class="text-sm font-semibold tabular-nums">+91 98765 43210</span>
          <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-semibold text-slate-600">Left</span>
        </div>
        <div class="flex items-center justify-between rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-3">
          <span class="text-sm font-semibold tabular-nums">+91 98123 45678</span>
          <span class="rounded-full bg-emerald-50 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-700">Connected</span>
        </div>
        <div class="flex items-center justify-between rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-3">
          <span class="text-sm font-semibold tabular-nums">+91 96345 67890</span>
          <span class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-[11px] font-semibold text-[var(--color-primary)]">Interested</span>
        </div>
      </section>

    </main>

    <!-- Clear dialog: shows the left and called counts before wiping the whole list -->
    <div class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-xs">
      <div class="w-full max-w-sm rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl text-left">

        <div class="flex items-center justify-between border-b border-[var(--color-border)] pb-3">
          <h3 class="text-base font-bold tracking-tight">Clear My List?</h3>
          <span class="rounded-full bg-red-50 px-2.5 py-0.5 text-[11px] font-semibold text-[var(--color-destructive)]">Cannot be undone</span>
        </div>

        <p class="mt-4 text-sm text-[var(--color-foreground)]">This wipes your whole list:</p>
        <div class="mt-2.5 flex items-center justify-between rounded-xl border border-[var(--color-border)] bg-[var(--color-muted)] p-3">
          <span class="text-sm font-semibold">Left</span>
          <span class="text-sm font-bold tabular-nums">8</span>
        </div>
        <div class="mt-2 flex items-center justify-between rounded-xl border border-[var(--color-border)] bg-[var(--color-muted)] p-3">
          <span class="text-sm font-semibold">Called</span>
          <span class="text-sm font-bold tabular-nums">12</span>
        </div>
        <p class="mt-3 text-xs text-[var(--color-muted-foreground)]">Nothing on the server is touched — your list lives only on this phone.</p>

        <div class="mt-5 flex justify-end gap-3">
          <button type="button" class="cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-2 text-sm font-semibold text-[var(--color-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Cancel</button>
          <button type="button" class="cursor-pointer rounded-xl bg-[var(--color-destructive)] px-4 py-2 text-sm font-semibold text-[var(--color-on-destructive)] transition-colors duration-200 hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Clear list</button>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
