<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — too many tries — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #000000;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #000000;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col px-6">
    <div class="my-auto py-10">

      <!-- Brand: the same phone mark the manager dashboard uses -->
      <div class="flex flex-col items-center text-center">
        <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-[var(--color-primary)] text-[var(--color-on-primary)]">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <h1 class="mt-4 text-xl font-bold tracking-tight">Apex Sales Call</h1>
        <p class="mt-1 text-sm text-[var(--color-muted-foreground)]">Sign in to start calling</p>
      </div>

      <!-- Login form: the name is the login ID -->
      <form class="mt-7 rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] p-5 shadow-sm">
        <div>
          <label for="login-name" class="text-sm font-medium">Name</label>
          <input id="login-name" name="name" type="text" autocomplete="username" placeholder="e.g. Priya Sharma" class="mt-1.5 w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-3 text-base transition-colors duration-200 placeholder:text-[var(--color-muted-foreground)] focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
        </div>
        <div class="mt-4">
          <label for="login-password" class="text-sm font-medium">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" class="mt-1.5 w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-3 text-base transition-colors duration-200 placeholder:text-[var(--color-muted-foreground)] focus:border-[var(--color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-ring)]">
        </div>
        <!-- Locked: 10 wrong tries block even the correct password for 5 minutes -->
        <div class="mt-5 flex items-center gap-2.5 rounded-xl bg-[var(--color-destructive)] px-4 py-3 text-[var(--color-on-destructive)]" role="alert">
          <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <p class="text-sm font-semibold leading-snug">Too many tries. Wait 5 minutes and try again.</p>
        </div>
        <button type="submit" aria-disabled="true" class="mt-4 w-full cursor-default rounded-xl bg-[var(--color-muted)] py-3.5 text-base font-bold text-[var(--color-muted-foreground)]">Login</button>
      </form>

      <p class="mt-5 text-center text-xs text-[var(--color-muted-foreground)]">Your calls are logged and sent to your manager by themselves.</p>

    </div>
  </div>

</body>
</html>
