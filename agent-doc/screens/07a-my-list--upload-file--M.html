<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My List — upload file — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="relative mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: My List active, dimmed behind the upload screen -->
    <header class="sticky top-0 z-20 flex items-center justify-center border-b border-[var(--color-border)] bg-[var(--color-card)] py-2 px-4 shadow-xs opacity-50">
      <div class="inline-flex items-center rounded-full bg-[var(--color-muted)] p-0.5 border border-[var(--color-border)] text-xs font-semibold">
        <span class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">Keypad</span>
        <span class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">Automated</span>
        <span class="rounded-full px-4 py-1 text-xs bg-[var(--color-primary)] text-white shadow-xs">My List</span>
      </div>
    </header>

    <!-- Background: the list, dimmed behind the upload screen -->
    <main class="flex-1 px-5 pb-6 pt-4 opacity-50">

      <!-- Actions at the top: Upload / Download / Clear, then Start Calling -->
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="flex cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-2 py-2 text-xs font-semibold text-[var(--color-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">
          <svg class="h-4 w-4 shrink-0 text-[var(--color-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload
        </button>
        <button type="button" class="flex cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-2 py-2 text-xs font-semibold text-[var(--color-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">
          <svg class="h-4 w-4 shrink-0 text-[var(--color-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>
        <button type="button" class="flex cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-2 py-2 text-xs font-semibold text-[var(--color-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">
          <svg class="h-4 w-4 shrink-0 text-[var(--color-destructive)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          Clear
        </button>
      </div>
      <button type="button" class="mt-2 flex w-full cursor-pointer items-center justify-center gap-2.5 rounded-2xl bg-[var(--color-accent)] py-3 text-base font-bold text-[var(--color-on-accent)] shadow-sm">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start Calling
      </button>

      <!-- List summary -->
      <section aria-label="List summary" class="mt-5">
        <h2 class="text-base font-bold tracking-tight">List summary</h2>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div class="rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] p-4 shadow-sm">
            <span class="text-sm font-medium text-[var(--color-muted-foreground)]">Left</span>
            <div class="mt-2 text-2xl font-bold tabular-nums tracking-tight">8</div>
          </div>
          <div class="rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] p-4 shadow-sm">
            <span class="text-sm font-medium text-[var(--color-muted-foreground)]">Called</span>
            <div class="mt-2 text-2xl font-bold tabular-nums tracking-tight">12</div>
          </div>
        </div>
      </section>

    </main>

    <!-- Upload screen 2 of 2: Pick a file - CSV or Excel, read right on the phone -->
    <div class="absolute inset-0 z-50 flex items-end justify-center bg-black/60 p-4 backdrop-blur-xs sm:items-center">
      <div class="max-h-[85vh] w-full max-w-sm overflow-y-auto rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl text-left">

        <div class="flex items-center justify-between border-b border-[var(--color-border)] pb-3">
          <h3 class="text-base font-bold tracking-tight">Upload numbers</h3>
          <span class="rounded-full bg-[var(--color-muted)] px-2.5 py-0.5 text-[11px] font-semibold text-[var(--color-muted-foreground)]">On this phone only</span>
        </div>

        <!-- Screen switch: Paste text | File (this screen) -->
        <div class="mt-4 inline-flex w-full rounded-xl border border-[var(--color-border)] bg-[var(--color-muted)] p-1" role="group" aria-label="Upload source">
          <span class="flex-1 rounded-lg px-3 py-1.5 text-center text-xs font-semibold text-[var(--color-muted-foreground)]">Paste text</span>
          <span class="flex-1 rounded-lg bg-[var(--color-primary)] px-3 py-1.5 text-center text-xs font-bold text-[var(--color-on-primary)] shadow-xs">File</span>
        </div>

        <!-- One real file input: tap and pick a CSV or Excel (.xlsx) file -->
        <label for="mylist-file-input" class="mt-4 flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-[var(--color-border)] bg-[var(--color-muted)] px-4 py-8 text-center transition-colors duration-200 hover:border-[var(--color-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">
          <span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[var(--color-card)] text-[var(--color-primary)] shadow-xs">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </span>
          <span class="mt-3 text-sm font-bold">Tap to pick a file</span>
          <span class="mt-0.5 text-[11px] text-[var(--color-muted-foreground)]">CSV or Excel (.xlsx) - numbers in one column</span>
        </label>
        <input type="file" id="mylist-file-input" accept=".csv,.xlsx" class="hidden" onchange="showPickedFile(this)">

        <!-- The picked file shows here -->
        <div id="picked-file-box" class="mt-2 hidden items-center gap-2.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-3 py-2.5">
          <svg class="h-4 w-4 shrink-0 text-[var(--color-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span id="picked-file-name" class="min-w-0 flex-1 truncate text-sm font-semibold tabular-nums">numbers.csv</span>
          <svg class="h-4 w-4 shrink-0 text-[var(--color-accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>

        <!-- How numbers are stored -->
        <p class="mt-4 rounded-xl bg-[var(--color-muted)] p-3 text-[11px] leading-relaxed text-[var(--color-muted-foreground)]">Numbers save in international format, built with your login country. A number already on the list starts fresh as Left.</p>

        <div class="mt-5 flex justify-end gap-3">
          <button type="button" class="cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] px-4 py-2 text-sm font-semibold text-[var(--color-foreground)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Cancel</button>
          <button type="button" class="cursor-pointer rounded-xl bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-[var(--color-on-primary)] transition-colors duration-200 hover:bg-[var(--color-secondary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2">Upload</button>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Same-page only: after a file is picked, show its name with a check
    function showPickedFile(input) {
      const pickedFile = input.files && input.files[0];
      if (!pickedFile) return;
      const pickedBox = document.getElementById('picked-file-box');
      document.getElementById('picked-file-name').textContent = pickedFile.name;
      pickedBox.classList.remove('hidden');
      pickedBox.classList.add('flex');
    }
  </script>

</body>
</html>
