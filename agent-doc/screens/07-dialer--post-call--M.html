<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialer — Post-call popup (lead call) — Apex Sales Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #6366F1;
      --color-on-primary: #FFFFFF;
      --color-secondary: #818CF8;
      --color-on-secondary: #0F172A;
      --color-accent: #059669;
      --color-on-accent: #FFFFFF;
      --color-background: #F5F3FF;
      --color-foreground: #1E1B4B;
      --color-card: #FFFFFF;
      --color-card-foreground: #1E1B4B;
      --color-muted: #EBEFF9;
      --color-muted-foreground: #475569;
      --color-border: #E0E7FF;
      --color-destructive: #DC2626;
      --color-on-destructive: #FFFFFF;
      --color-ring: #6366F1;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--color-background)] text-[var(--color-foreground)] antialiased">

  <div class="relative mx-auto flex min-h-screen w-full max-w-md flex-col">

    <!-- Header: Automated sub-tab active, dimmed behind the popup -->
    <header class="sticky top-0 z-20 flex items-center justify-center border-b border-[var(--color-border)] bg-[var(--color-card)] py-2 px-4 shadow-xs opacity-50">
      <div class="inline-flex items-center rounded-full bg-[var(--color-muted)] p-0.5 border border-[var(--color-border)] text-xs font-semibold">
        <span class="rounded-full px-4 py-1 text-xs text-[var(--color-muted-foreground)]">Keypad</span>
        <span class="rounded-full px-4 py-1 text-xs bg-[var(--color-primary)] text-white shadow-xs">Automated</span>
      </div>
    </header>

    <!-- Background: the finished call, dimmed behind the popup -->
    <main class="flex flex-1 flex-col px-5 pb-4 pt-2 opacity-50">
      <div class="my-auto py-8 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-[var(--color-accent)]">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <p class="mt-4 text-xs font-semibold uppercase tracking-wider text-emerald-700">Call finished</p>
        <p class="mt-1 text-2xl font-extrabold tabular-nums">+91 98765 43210</p>
        <span class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">Ended</span>
        <div class="mt-6">
          <button type="button" id="reopen-btn" onclick="reopenPopup()" class="mx-auto hidden w-full max-w-xs cursor-pointer rounded-xl border border-[var(--color-border)] bg-[var(--color-card)] py-2.5 text-xs font-semibold text-[var(--color-primary)] transition-colors duration-200 hover:bg-[var(--color-muted)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)]">Reopen call summary</button>
        </div>
      </div>
    </main>

    <!-- Post-call popup: opens by itself when the call ends. One Submit button, no outcome choices. -->
    <div id="post-call-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-xs">
      <div id="post-call-dialog" class="w-full max-w-sm rounded-3xl border border-[var(--color-border)] bg-[var(--color-card)] p-6 shadow-2xl text-left">

        <div class="flex items-center justify-between border-b border-[var(--color-border)] pb-3">
          <div>
            <h3 class="text-base font-bold tracking-tight">Call ended</h3>
            <p class="text-xs text-[var(--color-muted-foreground)] tabular-nums">+91 98765 43210</p>
          </div>
          <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-semibold text-slate-600">Ended</span>
        </div>

        <!-- Schedule question: "Do not schedule" pre-selected -->
        <div class="mt-4">
          <p class="text-sm font-bold">Schedule this number for the next call?</p>
          <div class="mt-2.5 space-y-2">
            <label class="flex cursor-pointer items-center justify-between rounded-xl border border-[var(--color-border)] p-3 transition-colors duration-200 hover:bg-[var(--color-background)] has-checked:border-[var(--color-primary)] has-checked:bg-indigo-50/40">
              <span class="text-sm font-bold text-[var(--color-foreground)]">Do not schedule</span>
              <input type="radio" name="schedule-choice" value="none" checked onchange="toggleScheduleInput()" class="h-4 w-4 text-[var(--color-primary)] focus:ring-[var(--color-ring)]">
            </label>
            <label class="flex cursor-pointer items-center justify-between rounded-xl border border-[var(--color-border)] p-3 transition-colors duration-200 hover:bg-[var(--color-background)] has-checked:border-[var(--color-primary)] has-checked:bg-indigo-50/40">
              <span class="text-sm font-bold text-[var(--color-foreground)]">Schedule</span>
              <!-- Choosing "Schedule" reveals the date and time below in the same popup -->
              <input type="radio" name="schedule-choice" value="pick" onchange="toggleScheduleInput()" class="h-4 w-4 text-[var(--color-primary)] focus:ring-[var(--color-ring)]">
            </label>
          </div>
          <div id="schedule-input-box" class="mt-2 hidden rounded-xl border border-indigo-200 bg-indigo-50/40 p-3">
            <label for="sched-dt" class="block text-[11px] font-semibold uppercase tracking-wider text-indigo-900">Follow-up time (IST)</label>
            <input type="datetime-local" id="sched-dt" value="2026-10-21T11:00" class="mt-1 w-full rounded-lg border border-indigo-200 bg-white px-2.5 py-1.5 text-xs font-medium text-[var(--color-foreground)]">
          </div>
        </div>

        <!-- Go to next call: pre-checked -->
        <div class="mt-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-background)] p-3">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="go-next-checkbox" checked class="h-4 w-4 rounded text-[var(--color-primary)] focus:ring-[var(--color-ring)]">
            <span class="text-xs font-bold text-[var(--color-foreground)]">Go to next call</span>
          </label>
          <p class="mt-1 pl-7 text-[10px] text-[var(--color-muted-foreground)]">Uncheck to stop automated calling after Submit.</p>
        </div>

        <!-- One Submit button: reads the call record and sends the call -->
        <div class="mt-5">
          <button type="button" class="w-full cursor-pointer rounded-xl bg-[var(--color-primary)] py-3 text-sm font-bold text-[var(--color-on-primary)] shadow-xs transition-colors duration-200 hover:bg-[var(--color-secondary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-ring)] focus-visible:ring-offset-2 text-center">Submit</button>
        </div>

      </div>
    </div>

    <!-- Bottom tab bar, dimmed behind the popup -->
    <nav class="sticky bottom-0 z-20 border-t border-[var(--color-border)] bg-[var(--color-card)] opacity-50" aria-label="App tabs">
      <div class="grid grid-cols-3">
        <div class="flex flex-col items-center gap-1 py-2 text-xs font-semibold text-[var(--color-primary)]">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Dialer
        </div>
        <div class="flex flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
          My Stats
        </div>
        <div class="flex flex-col items-center gap-1 py-2 text-xs font-medium text-[var(--color-muted-foreground)]">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l-.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Settings
        </div>
      </div>
    </nav>

  </div>

  <script>
    // Choosing "Schedule" reveals the date and time below in the same popup
    function toggleScheduleInput() {
      const box = document.getElementById('schedule-input-box');
      const picked = document.querySelector('input[name="schedule-choice"]:checked').value === 'pick';
      if (picked) box.classList.remove('hidden');
      else box.classList.add('hidden');
    }

    // Dismiss (tap outside) shows the reopen button; the button brings the popup back
    function dismissPopup() {
      document.getElementById('post-call-overlay').classList.add('hidden');
      document.getElementById('reopen-btn').classList.remove('hidden');
    }
    function reopenPopup() {
      document.getElementById('reopen-btn').classList.add('hidden');
      document.getElementById('post-call-overlay').classList.remove('hidden');
    }
    // Tap on the dark area closes the popup without Submit; tap on the dialog stays
    document.getElementById('post-call-overlay').addEventListener('click', function (event) {
      if (event.target === this) dismissPopup();
    });
  </script>

</body>
</html>
